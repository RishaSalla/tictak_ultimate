<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Risha Games | XO Ultimate</title>
    
    <!-- إضافة شعار ريشة كأيقونة للمتصفح -->
    <link rel="icon" type="image/png" href="assets/icons/risha-logo.png">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <button id="global-help-btn" class="nav-btn top-left">
        📜 التعليمات
    </button>

    <main class="glass-stage">
        
        <section id="screen-login" class="screen active center-flex">
            <div class="brand-container">
                <!-- استبدال النص بالشعار الجديد للعبة -->
                <img src="assets/icons/XO_Ultimate.png" alt="Risha XO Ultimate" class="main-game-logo">
                <div class="retro-badge">SYSTEM V.2.0</div>
            </div>
            
            <div class="login-box">
                <label class="mech-label"></label>
                <input type="password" id="pin-input" class="clay-input" maxlength="8" placeholder="••••••••" inputmode="numeric">
                <button id="btn-login" class="mech-btn primary block">ادخل الكود واضغط هنا</button>
            </div>
            <p id="login-msg" class="status-msg"></p>
        </section>

        <section id="screen-setup" class="screen center-flex hidden">
    <h2 class="screen-title">إعداد النظام</h2>
    
    <div class="toggle-container">
        <span class="toggle-label">فردي</span>
        <label class="switch">
            <input type="checkbox" id="team-mode-toggle">
            <span class="slider round"></span>
        </label>
        <span class="toggle-label">فرق</span>
    </div>

    <div class="setup-grid">
        <div class="team-card p1-border">
            <label>اسم الفريق (1)</label>
            <input type="text" id="p1-name" class="clay-input" placeholder="الفريق البرتقالي">
            
            <label class="sub-label">اختر الرمز المقاتل:</label>
            <div class="icon-selector" id="p1-icon-selector">
                <button class="icon-option selected" data-val="X">X</button>
                <button class="icon-option" data-val="sword"><img src="assets/icons/sword.svg"></button>
                <button class="icon-option" data-val="bolt"><img src="assets/icons/bolt.svg"></button>
            </div>

            <div class="roster-box hidden" id="p1-roster-box">
                <input type="text" id="p1-member" class="clay-input small" placeholder="اسم العضو..">
                <button id="btn-add-p1" class="mech-btn small">+</button>
                <ul id="p1-list" class="roster-list"></ul>
            </div>
        </div>

        <div class="team-card p2-border">
            <label>اسم الفريق (2)</label>
            <input type="text" id="p2-name" class="clay-input" placeholder="الفريق الأزرق">
            
            <label class="sub-label">اختر الرمز المقاتل:</label>
            <div class="icon-selector" id="p2-icon-selector">
                <button class="icon-option selected" data-val="O">O</button>
                <button class="icon-option" data-val="shield"><img src="assets/icons/shield.svg"></button>
                <button class="icon-option" data-val="skull"><img src="assets/icons/skull.svg"></button>
            </div>

            <div class="roster-box hidden" id="p2-roster-box">
                <input type="text" id="p2-member" class="clay-input small" placeholder="اسم العضو..">
                <button id="btn-add-p2" class="mech-btn small">+</button>
                <ul id="p2-list" class="roster-list"></ul>
            </div>
        </div>
    </div>

    <div class="timer-setup">
        <label>توقيت النقلة (ثواني):</label>
        <div class="timer-selector" id="timer-selector">
            <button class="timer-option selected" data-val="0">♾️</button>
            <button class="timer-option" data-val="5">05</button>
            <button class="timer-option" data-val="10">10</button>
            <button class="timer-option" data-val="20">20</button>
        </div>
    </div>

    <button id="btn-save-setup" class="mech-btn primary block">حفظ وبدء المعركة</button>
</section>

        <section id="screen-menu" class="screen center-flex hidden">
            <h2 class="screen-title">اختر بروتوكول التحدي</h2>
            <div class="modes-grid-layout">
                <button class="mode-card span-2" data-mode="classic">
                    <img src="assets/icons/clash.svg" class="icon-lg">
                    <span>كلاسيكي</span>
                </button>
                <button class="mode-card" data-mode="clash">
                    <img src="assets/icons/clash.svg" class="icon-md">
                    <span>المواجهة</span>
                </button>
                <button class="mode-card" data-mode="void">
                    <img src="assets/icons/code.svg" class="icon-md">
                    <span>المجهول</span>
                </button>
                <button class="mode-card" data-mode="balance">
                    <img src="assets/icons/balance.svg" class="icon-md">
                    <span>الميزان</span>
                </button>
                <button class="mode-card" data-mode="duality">
                    <img src="assets/icons/duality.svg" class="icon-md">
                    <span>الثنائيات</span>
                </button>
            </div>
        </section>

        <section id="screen-game" class="screen hidden">
            <header class="game-header">
                <button id="btn-back" class="nav-btn">
                    <img src="assets/icons/back.svg" class="icon-sm"> رجوع
                </button>
                <div class="turn-display">
                    <span id="turn-text">الدور لـ...</span>
                    <div id="timer-bar" class="timer-bar"><div class="bar-fill"></div></div>
                </div>
                <div class="score-board">
                    <span class="p1-score" id="score-p1">0</span> : <span class="p2-score" id="score-p2">0</span>
                </div>
            </header>

            <div class="arena-container">
                <aside class="side-panel p1-side">
                    <div class="player-info">
                        <img id="p1-avatar-img" class="avatar-icon">
                        <span id="p1-display-name">P1</span>
                    </div>
                    <div class="powers-vertical">
                        <button class="power-btn p1" data-power="nuke">
                            <img src="assets/icons/nuke.svg"> <span>نووي</span>
                        </button>
                        <button class="power-btn p1" data-power="freeze">
                            <img src="assets/icons/freeze.svg"> <span>تجميد</span>
                        </button>
                        <button class="power-btn p1" data-power="hack">
                            <img src="assets/icons/hack.svg"> <span>هاك</span>
                        </button>
                    </div>
                </aside>

                <div class="grid-wrapper">
                    <div id="game-grid" class="fixed-grid"></div>
                </div>

                <aside class="side-panel p2-side">
                    <div class="player-info">
                        <img id="p2-avatar-img" class="avatar-icon">
                        <span id="p2-display-name">P2</span>
                    </div>
                    <div class="powers-vertical">
                        <button class="power-btn p2" data-power="nuke">
                            <img src="assets/icons/nuke.svg"> <span>نووي</span>
                        </button>
                        <button class="power-btn p2" data-power="freeze">
                            <img src="assets/icons/freeze.svg"> <span>تجميد</span>
                        </button>
                        <button class="power-btn p2" data-power="hack">
                            <img src="assets/icons/hack.svg"> <span>هاك</span>
                        </button>
                    </div>
                </aside>
            </div>

            <footer class="game-log-bar">
                <span class="log-cursor">></span>
                <span id="game-log-text">بانتظار بدء اللعب...</span>
            </footer>
        </section>
    </main>

    <!-- النافذة المنبثقة: إعدادات الرياضيات الديناميكية -->
    <div id="modal-math-setup" class="modal-overlay hidden">
        <div class="mech-modal">
            <header class="modal-header">
                <h3>إعدادات التحدي الرياضي</h3>
                <button class="close-modal-btn" id="btn-close-math-setup">✕</button>
            </header>
            <div class="modal-body" style="text-align: center;">
                
                <div style="margin-bottom: 20px;">
                    <label class="sub-label" style="display: block; margin-bottom: 10px;">نطاق الأرقام:</label>
                    <div style="display: flex; justify-content: center; gap: 10px;">
                        <input type="number" id="math-range-min" class="clay-input small" placeholder="من" value="1" min="1" max="99" style="width: 80px; text-align: center;">
                        <span style="color: var(--text-muted); align-self: center;">إلى</span>
                        <input type="number" id="math-range-max" class="clay-input small" placeholder="إلى" value="12" min="2" max="100" style="width: 80px; text-align: center;">
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <label class="sub-label" style="display: block; margin-bottom: 10px;">العمليات الحسابية:</label>
                    <div class="icon-selector" id="math-op-selector" style="justify-content: center; margin-bottom: 15px;">
                        <button class="icon-option selected op-btn" data-op="+">(+)</button>
                        <button class="icon-option op-btn" data-op="-">(-)</button>
                        <button class="icon-option op-btn" data-op="*">(×)</button>
                        <button class="icon-option op-btn" data-op="/">(÷)</button>
                    </div>
                    <button id="btn-math-random" class="mech-btn small">عشوائي (الكل)</button>
                </div>

                <button id="btn-confirm-math-setup" class="mech-btn primary block" style="margin-top: 10px;">تأكيد وبدء المعركة</button>
            </div>
        </div>
    </div>

    <!-- النافذة المنبثقة: التعليمات -->
    <div id="modal-instructions" class="modal-overlay hidden">
        <div class="mech-modal wide">
            <header class="modal-header">
                <h3>دليل العمليات</h3>
                <button class="close-modal-btn">✕</button>
            </header>
            <div class="tabs-container">
                <button class="tab-btn active" data-tab="rules">القواعد</button>
                <button class="tab-btn" data-tab="math">الرياضيات</button>
                <button class="tab-btn" data-tab="powers">القوى</button>
            </div>
            <div class="modal-body" id="help-body">
                </div>
        </div>
    </div>

    <!-- النافذة المنبثقة: الحاسبة (وقت اللعب) -->
    <div id="modal-calc" class="modal-overlay hidden">
        <div class="mech-modal calc-theme">
            <div class="calc-lcd" id="calc-q">...</div>
            <div class="calc-input-display" id="calc-inputs"></div>
            <div class="numpad-grid">
                <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
                <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
                <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
                <button data-key="del" class="del-btn">⌫</button>
                <button data-key="0">0</button>
                <button data-key="ok" class="ok-btn">✔</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
